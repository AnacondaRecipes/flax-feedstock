{% set name = "flax" %}
{% set version = "0.12.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 309a5fdfac8fe9cc03260c122a2cab6881bc366cd2d928aedb80ddffbfb202e4

build:
  number: 0
  # skip: py314: no tensorflow for py314, dependency for orbax-export
  skip: true  # [py<311 or py>313]
  # skip win: no tensorstore/orbax for win in channel
  skip: true  # [win]
  
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python
    - numpy >=1.23.2  # [py>=311]
    - jax >=0.8.1
    - msgpack-python
    - optax
    - orbax-checkpoint
    - tensorstore
    - rich >=11.1.0
    - typing_extensions >=4.2.0
    - pyyaml >=5.4.1
    - treescope >=0.1.7
    - orbax-export >=0.0.8

test:
  source_files:
    - tests
  imports:
    - flax
    - flax.configurations
    - flax.core
    - flax.cursor
    - flax.errors
    - flax.ids
    - flax.linen
    - flax.metrics
    - flax.training
    - flax.traverse_util
    - flax.typing
  commands:
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Limit threading to avoid native-library thread oversubscription when
    # pytest-xdist workers each import TF+JAX+MKL-linked numpy in parallel
    - export OMP_NUM_THREADS=1
    - export MKL_NUM_THREADS=1
    - pytest -ra -vvv tests --ignore=tests/checkpoints_test.py --ignore=tests/tensorboard_test.py
  requires:
    - pip
    - pytest
    - pytest-xdist
    - tensorflow >=2.12.0   # [py<313]
    - tensorflow >=2.20.0   # [py>=313]
    - cloudpickle >=3.0.0
    - importlib_resources

about:
  home: https://github.com/google/flax
  summary: Flax A neural network library for JAX designed for flexibility
  description: |
    Flax provides a flexible end-to-end user experience for researchers and 
    developers who use JAX for neural networks. Flax enables you to use the full power of JAX
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  doc_url: https://flax.readthedocs.io
  dev_url: https://github.com/google/flax

extra:
  recipe-maintainers:
    - pfackeldey
    - PhilipVinc
    - jheek
    - avital
    - levskaya
    - andsteing
    - gabrielcnr
    - traversaro
